title: DateLock
description: Customers pick a delivery date before checkout, checkout needs one to finish, and the date is saved on the Shopify order.
url: https://getdatelock.com
theme: minima
permalink: pretty
logo: /assets/icon-512.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Link-preview image for every page
defaults:
  - scope:
      path: ""
    values:
      image: /assets/demo-poster.jpg

# When the app is live on the Shopify App Store, set this to the listing URL
# (e.g. https://apps.shopify.com/datelock). Blank = CTAs show "Get early access"
# (mailto); set = every CTA becomes "Add to Shopify" pointing at the listing.
app_store_url: "https://apps.shopify.com/datelock"

# Brand mark in the header doubles as Home; nav lists only the legal pages.
header_pages:
  - privacy-policy.md
  - terms-of-use.md
  - data-processing-agreement.md

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
