<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon-180.png' | relative_url }}">
{%- if page.url == "/" %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":{{ site.title | jsonify }},"url":{{ "/" | absolute_url | jsonify }},"logo":{{ site.logo | absolute_url | jsonify }}{% if site.app_store_url != "" %},"sameAs":[{{ site.app_store_url | jsonify }}]{% endif %}}</script>
{%- endif %}
